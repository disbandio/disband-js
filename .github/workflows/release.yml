name: Release

# release-please keeps a release PR with the next version from the Conventional Commits on main
# merging that PR tags it and makes a GitHub release with the notes, and the publish job then sends that version to npm
# publishing runs in this workflow, as a release made with GITHUB_TOKEN starts no other workflow

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          target-branch: main

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # npm's trusted publishing signs in with GitHub's OIDC token, so there is no npm token, and adds provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      # npm rather than pnpm, as trusted publishing is npm's, and prepack builds dist
      - run: npm publish
